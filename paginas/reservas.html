<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="Reservas">Reserva tú bicicleta</title>
</head>

<body>

    <header>
      <h1>RUEDA LIBRE</h1>
      <img src="../img/logo.png" alt="Logo Rueda Libre" width="300">
    </header>

    <nav>
        <h2>Menú</h2>
            <ul>
                <li><a href="../index.html#Inicio">Inicio</a></li>
                <li><a href="tarifas.html#Tarifas">Tarifas</a></li>
                <li><a href="tarifas.html#Rutas">Rutas</a></li>
                <li><a href="#Reservas">Reservas</a></li>
            </ul>
    </nav>

    <main>

        <a href="mailto:ruedalibre@gmail.com">Escríbenos</a>

        <h2>Horario de atención</h2>
            <dl>
                <dt>De lunes a viernes</dt>
                <dd>7am a 7pm</dd>
                <dt>Sabados, Domingos y Festivos</dt>
                <dd>6am a 2pm</dd>
            </dl>

        <section>
            <h2>Formulario de reserva</h2>

            <form action="#" method="post">

                <fieldset>
                    <legend>Tus datos</legend>

                    <p>
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre">
                    </p>
                    <p>
                        <label for="documento">Documento de identidad</label>
                        <input type="text" id="documento" name="documento">
                    </p>
                    <p>
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" name="correo">
                    </p>
                    <p>
                        <label for="telefono">Telefono de contacto</label>
                        <input type="tel" id="telefono" name="telefono">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Tu alquiler</legend>

                    <p>
                        <label for="fecha">Fecha de reserva</label>
                        <input type="date" id="fecha" name="fecha">
                    </p>

                    <p>Tipo de bicicleta</p>
                    <p>
                        <input type="radio" id="urbana" name="bicicleta" value="urbana">
                        <label for="urbana">Urbana</label>
                        <input type="radio" id="montana" name="bicicleta" value="montana">
                        <label for="montana">Montaña</label>
                        <input type="radio" id="electrica" name="bicicleta" value="electrica">
                        <label for="electrica">Eléctrica</label>
                    </p>

                    <p>
                        <label for="plan">Plan</label>
                        <select id="plan" name="plan">
                            <option value="">Seleccione un plan</option>
                            <option value="plan1">1 hora</option>
                            <option value="plan2">Medio día</option>
                            <option value="plan3">Día completo</option>
                        </select>
                    </p>

                    <p>
                        <label for="nbicicletas">Número de bicicletas</label>
                        <input type="number" id="nbicicletas" name="nbicicletas">
                    </p>

                    <p>
                        <label for="recorrido">Recorrido guiado</label>
                        <select id="recorrido" name="recorrido">
                            <option value="">Seleccione un recorrido</option>
                            <option value="sinrecorrido">Sin recorrido</option>
                            <option value="recorrido1">Ríos y parques</option>
                            <option value="recorrido2">Sabores de barrio</option>
                            <option value="recorrido3">Reto las palmas</option>
                        </select>
                    </p>

                    <p>
                        <label for="comentarios">Deja tú comentario</label>
                    </p>
                    <p>
                        <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Comentarios adicionales"></textarea>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Confirmación</legend>
                    <p>
                        <input type="checkbox" id="politicas" name="politicas">
                        <label for="politicas">Acepto las políticas de alquiler</label>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Enviar reserva</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <h4>Rueda LIbre</h4>
        <h4>ruedalibre@gmail.com</h4>
        <h4>2026</h4>
    </footer>

</body>
</html>
